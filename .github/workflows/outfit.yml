# Builds the Personal Outfit Android app. Every push that touches outfit/ builds and tests it (APK under the run's
# artifacts); pushes to main also publish it at a fixed download link:
# https://github.com/silpachandran08-web/Expense/releases/download/outfit-latest/personal-outfit.apk
name: Personal Outfit app
on:
  push:
    paths: ['outfit/**', '.github/workflows/outfit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Same signing as the Expense Sync app (see android.yml): the shared key when the secrets are set, else a one-off key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias expense-sync -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Personal Outfit" -validity 20000 -keyalg RSA -keysize 2048
            echo "SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: outfit/models.sh
      - run: gradle -p outfit testReleaseUnitTest assembleRelease --no-daemon
      - run: cp outfit/app/build/outputs/apk/release/app-release.apk personal-outfit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: personal-outfit
          path: personal-outfit.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: outfit-latest
          name: Personal Outfit for Android
          make_latest: false
          files: personal-outfit.apk
          body: |
            Install personal-outfit.apk on your phone (allow "Install unknown apps" for your browser when asked).
            Add 3 to 5 full-length photos of yourself, then check any dress photo. Everything runs on the phone.
