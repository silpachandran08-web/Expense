<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Expenses</title>
<style>
  :root { --bg: #f7f7f8; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #d4d4d8; --accent: #15803d; --accent-text: #fff; --error: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa1; --line: #3a3a40; --accent: #4ade80; --accent-text: #052e16; --error: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field { position: relative; }
  input[type=password], input[type=text] { width: 100%; font: inherit; padding: 12px 64px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .show { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 13px; padding: 6px 8px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .error { color: var(--error); font-size: 14px; margin: 8px 0 0; }
  .submit { width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">﷼</div>
  <h1>Expenses</h1>
  <p>Sign in to see your spending.</p>
  <form method="post" action="/login">
    <!-- Lets Samsung Pass / Google Password Manager save and fill the password. -->
    <input class="hidden" type="text" name="username" value="expense" autocomplete="username" aria-hidden="true" tabindex="-1">
    <label for="password">Password</label>
    <div class="field">
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="error">
      <button class="show" type="button" aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <div id="error" class="error" role="alert"></div>
    <button class="submit" type="submit">Sign in</button>
  </form>
</main>
<script>
  const error = new URLSearchParams(location.search).get('error');
  if (error) document.getElementById('error').textContent = error === 'setup'
    ? 'Login is not set up yet: in Vercel, add EXPENSE_TOKEN (at least 16 characters) for Production, then redeploy.'
    : 'Wrong password. Try again.';
  const input = document.getElementById('password'), toggle = document.querySelector('.show');
  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', show);
  });
</script>
</body>
</html>
