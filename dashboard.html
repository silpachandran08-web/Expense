<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: dark)">
<title>Expenses</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f1f3; --line: #e6e7ea;
    --text: #0b0b0c; --text-2: #52514e; --muted: #77767a;
    --accent: #2a78d6; --accent-soft: #dbe8f8; --bar: #2a78d6; --bar-dim: #b7d3f6; --bar-2: #12a37a;
    --good: #0f7b3e; --bad: #b42318; --warn: #a15c00; --warn-soft: #fdf1dc;
    --hero-from: #1c5cab; --hero-to: #2a78d6; --hero-text: #ffffff; --hero-muted: #cde2fb;
    --clock: 0s; --sheen: rgb(255 255 255 / .25);
    --save: #16b673; --save-ink: #0b8050; --debt: #ff6a4d; --debt-ink: #cf3d22;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1012; --surface: #1a1a1c; --surface-2: #242427; --line: #2c2c30;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #93929a;
      --accent: #5598e7; --accent-soft: #1d3150; --bar: #3987e5; --bar-dim: #24456f; --bar-2: #34c392;
      --good: #4ade80; --bad: #f87171; --warn: #f5b84a; --warn-soft: #3a2a0c;
      --hero-from: #104281; --hero-to: #1c5cab; --hero-text: #ffffff; --hero-muted: #b7d3f6;
      --save: #2fd08a; --save-ink: #4fdc9c; --debt: #ff6f55; --debt-ink: #ff8b74;
      --sheen: rgb(255 255 255 / .12); --card-line: color-mix(in srgb, var(--accent) 25%, var(--line));
    }
  }
  * { box-sizing: border-box; }
  input, select, textarea { max-width: 100%; }  /* a form field never pushes the page wider than the phone */
  html, body { overflow-x: clip; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(88px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  button, select, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  h1:focus { outline: none; }
  .num, .v, .total, .kpis b { font-variant-numeric: tabular-nums; }

  /* App bar */
  .appbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: env(safe-area-inset-top) 4px 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .appbar.drill { padding-left: 4px; }
  .appbar.nocur #currency { display: none; }  /* a detail page keeps the currency it was opened in; the title needs the room */
  .titles { flex: 1; min-width: 0; }
  .titles h1 { font-size: 20px; line-height: 1.2; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drill .titles h1 { font-size: 17px; }
  .titles .sub { margin: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; flex: none; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; min-height: 32px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .icon-btn { flex: none; border: 0; background: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); text-decoration: none; }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Bottom tabs */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { position: relative; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); text-decoration: none; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar a[aria-current="page"], .tabbar a.on { color: var(--accent); font-weight: 600; }
  .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }

  /* Period chips: the only horizontal scroller */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: -4px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips a { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .chips a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips .month-pick { flex: none; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .chips .month-pick.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--hero-from), var(--hero-to)); color: var(--hero-text); border-radius: 16px; padding: 12px 16px 16px;
    box-shadow: 0 10px 28px -14px var(--hero-from); }
  .hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(rgb(255 255 255 / .16), transparent 70%); }
  .hero::before { width: 260px; height: 260px; right: -90px; top: -110px; }
  .hero::after { width: 180px; height: 180px; left: -70px; bottom: -100px; }
  .hero > * { position: relative; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .month-nav button { flex: none; border: 0; background: rgb(255 255 255 / .16); color: inherit; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1; }
  .month-nav button:disabled { opacity: .35; cursor: default; }
  .month-nav span { min-width: 0; text-align: center; font-weight: 600; font-size: 15px; }
  .month-nav small { display: block; font-weight: 500; font-size: 12px; color: var(--hero-muted); }
  .hero .label { color: var(--hero-muted); font-size: 13px; }
  .hero .total { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .hero .total small { font-size: 15px; font-weight: 600; margin-right: 6px; color: var(--hero-muted); }
  .hero .refunds { font-size: 13px; color: var(--hero-muted); margin-top: 4px; }
  .delta { display: inline-block; margin-top: 4px; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: rgb(255 255 255 / .16); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 16px; }
  .kpis div { min-width: 0; }
  .kpis span { display: block; font-size: 12px; color: var(--hero-muted); }
  .kpis b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / .2); font-size: 13px; }
  .proj b { font-variant-numeric: tabular-nums; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 14px -8px rgb(0 0 0 / .08); }
  .donut { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 16px; align-items: center; margin: 4px 0 12px; }
  .donut .ring { position: relative; }
  .donut svg { display: block; width: 100%; }
  .donut circle { fill: none; stroke-width: 4.4; }
  .donut .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
  .donut .mid small { font-size: 11px; color: var(--muted); }
  .donut .mid b { font-size: 18px; }
  .donut ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; min-width: 0; }
  .donut li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .donut li i { width: 10px; height: 10px; border-radius: 3px; }
  .donut li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .donut li b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .card h2 { font-size: 17px; margin: 0 0 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
  .card h2 > span { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card h2 + .card-sub { margin: -4px 0 8px; font-size: 13px; color: var(--muted); }
  .more { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: none; }
  .banner { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border-radius: 16px; background: var(--warn-soft); color: var(--text); text-decoration: none; font-weight: 600; }
  .banner span { flex: 1; }
  .banner .go, .ln .go { color: var(--muted); font-size: 20px; }

  /* Ranked bar row */
  .rk { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 40px; grid-template-rows: auto 4px; column-gap: 12px; row-gap: 6px; align-items: center; min-height: 56px; padding: 8px 0; text-decoration: none; color: inherit; }
  .rk + .rk, .sublink + .rk { border-top: 1px solid var(--line); }
  .rk .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; }
  .rk .nm { min-width: 0; }
  .rk .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .nm small, .rk .v small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .v { text-align: right; font-weight: 600; white-space: nowrap; }
  .rk .pc { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rk .tr { grid-column: 2 / -1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .rk .tr i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
  .acct { display: flex !important; min-width: 0; }
  .acct span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct span:last-child { flex: none; padding-left: 4px; }
  .up { color: var(--bad) !important; } .down { color: var(--good) !important; }
  .sublink { display: inline-flex; align-items: center; min-height: 44px; margin: -8px 0 0 44px; color: var(--warn); font-weight: 600; font-size: 13px; text-decoration: none; }

  /* Link rows (Insights, settings) */
  .ln { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; text-decoration: none; color: inherit; }
  .ln + .ln { border-top: 1px solid var(--line); }
  .rk .nm b.wrap { white-space: normal; overflow-wrap: anywhere; }
  .jr { list-style: none; margin: 0; padding: 4px 0 0; }
  .jr + .jr { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .jr li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 0 0 12px 22px; }
  .jr li::before { content: ''; position: absolute; left: 3px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .jr li:not(:last-child)::after { content: ''; position: absolute; left: 7px; top: 18px; bottom: 0; border-left: 2px solid var(--line); }
  .jr li.likely::after { border-left-style: dashed; }
  .jr li.end::before { background: var(--good, #0f7b3e); }
  .jr li b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jr li small { grid-column: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jr li .v { grid-row: 1; grid-column: 2; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .jr li.end b { color: var(--good, #0f7b3e); }
  .sk svg { display: block; width: 100%; height: auto; overflow: visible; }
  .sk .band path { opacity: .38; transition: opacity .2s; cursor: pointer; } .sk .band:hover path, .sk .band.on path { opacity: .7; }
  .sk text { font-size: 10px; font-weight: 600; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .sk text.amt { font-weight: 500; fill: var(--muted); }
  details.fl > summary { list-style: none; cursor: pointer; } details.fl > summary::-webkit-details-marker { display: none; }
  details.fl + details.fl { border-top: 1px solid var(--line); }
  details.fl[open] > summary .rk .pc::after { content: '▴'; } details.fl > summary .rk .pc::after { content: '▾'; color: var(--muted); }
  .ev { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; display: grid; gap: 8px; }
  .ev .why { color: var(--good, #0f7b3e); font-weight: 600; }
  .ev .nomatch { color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
  .ev-t { display: grid; gap: 4px; min-width: 0; } .ev-t + .ev-t { border-top: 1px dashed var(--line); padding-top: 8px; }
  .ev-t span { color: var(--muted); font-size: 12px; }
  .ev-t pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, monospace; color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 8px; }
  .ev-t form { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; } .ev-t form label { flex: 1; min-width: 0; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .ev-t select, form.link select { max-width: 100%; width: 100%; }
  form.link { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; } form.link label { flex: 1; min-width: 0; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .jr li.split { display: block; padding-bottom: 4px; }
  .big b.good { color: var(--good, #0f7b3e); } .big b.warn { color: #d97706; } .big b.bad { color: var(--bad, #b42318); }
  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); margin: 10px 0 6px; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--good, #0f7b3e); } .meter i.warn { background: #d97706; } .meter i.bad { background: var(--bad, #b42318); }
  .meter s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }
  .owed-bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 18px; }
  .owed-bars div { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .owed-bars i { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--debt, #e5533d); opacity: .8; }
  .owed-bars div:last-child i { opacity: 1; }
  .owed-bars small { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .owed-bars b { font-size: 9px; font-weight: 600; color: var(--text-2); white-space: nowrap; margin-bottom: 2px; }
  details.lb.late > summary .rk .nm small { color: var(--bad, #b42318); }
  details.lb .over { color: var(--bad, #b42318); font-weight: 600; }
  details.lb .rk .nm b, details.lb .rk .nm small { white-space: normal; overflow-wrap: anywhere; }
  details.lb .rk .v { font-size: 13px; } details.lb .rk .v small { font-size: 11px; }
  .banner.warn { border-color: #d97706; }
  .kind-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; margin: 2px 0 6px; }
  .kind-tag small { font-weight: 400; color: var(--muted); }
  details.bal-src { margin: 6px 0 0; } details.bal-src > summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details.bal-src pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, monospace; background: var(--surface-2); border-radius: 8px; padding: 8px; margin: 6px 0; }
  .ms-head { background: #17204D; color: #fff; border-radius: 22px; padding: 14px 16px; display: grid; gap: 7px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ms-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #C7D2FE; }
  .ms-link { color: #E0E7FF; font-weight: 600; text-decoration: none; }
  .ms-sub { font-size: 13px; color: #C7D2FE; } .ms-big { font-size: 30px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ms-bar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: rgb(255 255 255 / .15); } .ms-bar i { display: block; height: 100%; }
  .ms-keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 12px; color: #E0E7FF; }
  .ms-keys i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .ms-att { background: var(--warn-soft); border-radius: 14px; padding: 0 14px; font-size: 14px; }
  .ms-att summary { cursor: pointer; padding: 11px 0; font-weight: 600; color: var(--warn); }
  .ms-att a { display: block; padding: 10px 0; border-top: 1px solid rgb(0 0 0 / .06); color: var(--text); text-decoration: none; }
  .ms-buy { display: grid; gap: 6px; } .ms-buy label { font-size: 14px; font-weight: 600; } .ms-buy div { display: flex; gap: 8px; }
  .ms-buy input { flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font: inherit; background: var(--surface); color: var(--text); }
  .ms-buy .btn { height: 46px; background: #34D3A6; color: #062A23; }
  .ms-coming h2 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; } .ms-coming h2 a { font-size: 13px; font-weight: 600; text-decoration: none; }
  .ms-ev { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ms-date { width: 44px; flex: none; display: grid; justify-items: center; background: var(--surface-2); border-radius: 10px; padding: 4px 0; font-size: 10px; color: var(--text-2); }
  .ms-date b { font-size: 15px; color: var(--text); line-height: 1.1; }
  .ms-what { flex: 1; min-width: 0; display: grid; } .ms-what b, .ms-what small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ms-what small { color: var(--text-2); }
  .ms-ev > b.in { color: var(--good); } .ms-ev.late .ms-date { background: #FEE2E2; } .ms-ev.late small { color: var(--bad); }
  .ms-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ms-tile { border-radius: 16px; padding: 10px 14px; display: grid; gap: 2px; text-decoration: none; }
  .ms-tile span { font-size: 12px; } .ms-tile b { font-size: 19px; }
  .ms-tile.green { background: #ECFDF5; color: #065F46; } .ms-tile.blue { background: #EEF2FF; color: #3730A3; }
  details.acct-edit { margin-top: 10px; } details.acct-edit > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
  form.acct-form { display: grid; gap: 10px; margin-top: 10px; } form.acct-form label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
  form.acct-form input, form.acct-form select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; max-width: 100%; }
  form.acct-form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; } form.acct-form .btn { justify-self: start; }
  .acct-row { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; } .acct-row:first-of-type { border-top: 0; }
  .acct-row > button { justify-self: start; }
  dl.carry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; margin: 12px 0 0; font-size: 14px; }
  dl.carry dt { color: var(--text-2); } dl.carry dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  dl.carry dd.in { color: var(--good, #0f7b3e); } dl.carry dd.out { color: var(--bad, #b42318); }

  /* Motion, chosen in Settings → Animations: html.motion = full animations, html.still = a gentle fade only
     (Follow phone with the phone set to reduce motion), neither = Off. */
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes fill { from { transform: scaleX(0); } }
  @keyframes spin-in { from { opacity: 0; rotate: -120deg; scale: .8; } }  /* not transform: the endless spin owns that */
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } }
  /* Always-on (ambient) motion */
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, 40px) scale(1.25); } }
  @keyframes drift2 { from { transform: translate(0, 0) scale(1); } to { transform: translate(70px, -30px) scale(.85); } }
  @keyframes march { to { background-position: 8.49px 0; } }
  @keyframes glow { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  @keyframes sweep { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  /* Pulse HUD */
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @keyframes orbit { to { --a: 360deg; } }
  @keyframes materialize { from { opacity: 0; transform: translateY(14px); filter: blur(6px) brightness(1.4); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes scan { 0%, 30% { transform: translateX(0); opacity: 0; } 40%, 90% { opacity: 1; } 100% { transform: translateX(900%); opacity: 0; } }
  @keyframes ignite { from { box-shadow: 0 0 0 0 var(--bar-2); } to { box-shadow: 0 0 0 6px transparent; } }
  @keyframes sheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
  html.still .view.anim > * { animation: fade .35s ease-out both; }
  html.still .view.anim > :nth-child(2) { animation-delay: .05s; } html.still .view.anim > :nth-child(n+3) { animation-delay: .1s; }
  html.motion .txn.leaving { transition: opacity .25s; }
  html.motion .view.anim > * { animation: materialize .5s cubic-bezier(.2, .8, .2, 1) both; }
  html.motion .view.anim > :nth-child(2) { animation-delay: .05s; } html.motion .view.anim > :nth-child(3) { animation-delay: .1s; }
  html.motion .view.anim > :nth-child(4) { animation-delay: .15s; } html.motion .view.anim > :nth-child(5) { animation-delay: .2s; }
  html.motion .view.anim > :nth-child(n+6) { animation-delay: .25s; }
  html.motion .view.anim .bars .col { transform-origin: bottom; animation: grow .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.15s + var(--k, 0) * 15ms); }
  html.motion .view.anim .rk .tr i { transform-origin: left; animation: fill .8s .2s cubic-bezier(.2, .8, .2, 1) both; }
  html.motion .donut svg { animation: spin 24s var(--clock) linear infinite; }  /* the ring turns; the total in the middle stays upright */
  html.motion .view.anim .donut svg { animation: spin-in .9s .1s cubic-bezier(.2, .8, .2, 1) both, spin 24s var(--clock) linear infinite; }
  html.motion .view.anim .donut li { animation: rise .4s both; animation-delay: .35s; }
  html.motion .view.anim .cal a { animation: pop .4s both; animation-delay: calc(.1s + var(--k, 0) * 12ms); }
  html.motion .toast:not([hidden]) { animation: toast-in .3s cubic-bezier(.2, .8, .2, 1); }
  html.motion .txn[open] > :not(summary) { animation: rise .3s both; }
  html.motion :is(.rk, .ln, .banner, .btn, .chips a, .cal a, .fix button) { transition: transform .15s, background-color .2s; }
  html.motion :is(.rk, .ln, .banner, .btn, .chips a, .cal a, .fix button):active { transform: scale(.97); }
  /* Ambient, running all the time: the summary box's light spots drift; expected bars' stripes
     march (it's a prediction); regular payments glow; a light sweeps along the bars; the donut breathes; today pulses. */
  /* Delays come from --clock (set on every render) so a 30-second refresh redraw continues the loops in phase. */
  html.motion .hero { border: 1.5px solid transparent; transition: rotate .3s ease-out;  /* + a neon light orbiting the edge */
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to), #5b4fd6, var(--hero-from)) padding-box,
      conic-gradient(from var(--a), transparent 0 70%, var(--bar-2), #fff, var(--accent), transparent) border-box;
    background-size: 140% 140%, 100% 100%; background-position: 30% 30%, 0 0; animation: orbit 6s linear infinite; animation-delay: var(--clock); }
  html.motion .view.anim > .hero { animation: materialize .5s cubic-bezier(.2, .8, .2, 1) both, orbit 6s linear infinite; animation-delay: 0s, var(--clock); }
  html.motion .hero::before { animation: drift 9s var(--clock) ease-in-out infinite alternate; }
  html.motion .hero::after { animation: drift2 11s var(--clock) ease-in-out infinite alternate; }
  .hero > canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  html.motion :is(.hero .total, .kpis b, .proj) { text-shadow: 0 1px 2px rgb(0 0 0 / .25); }
  html.motion .view { perspective: 1000px; }  /* for the summary box's tilt */
  html.motion .bars .col.f { background-size: 8.49px 8.49px; animation: march 1.4s var(--clock) linear infinite; }
  html.motion .view.anim .bars .col.f { animation: grow .7s cubic-bezier(.2, .8, .2, 1) both, march 1.4s linear infinite; animation-delay: calc(.15s + var(--k, 0) * 15ms), var(--clock); }
  html.motion .bars .col.f i { animation: glow 2.2s var(--clock) ease-in-out infinite; }
  /* Today's bar in the forecast is a beacon; a scan beam passes over the charts. */
  html.motion .bars.forecast > a:has(+ .first) .col { box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--accent); animation: glow 2.4s var(--clock) ease-in-out infinite; }
  html.motion .view.anim .bars.forecast > a:has(+ .first) .col { animation: grow .7s cubic-bezier(.2, .8, .2, 1) both, glow 2.4s ease-in-out infinite; animation-delay: calc(.15s + var(--k, 0) * 15ms), var(--clock); }
  html.motion .bars.forecast .first { border-left-color: var(--accent); }
  html.motion .bars:not(.mini) { position: relative; }  /* no overflow: hidden, the "Today" label sticks out */
  html.motion .bars:not(.mini)::after { content: ''; position: absolute; top: 0; bottom: 18px; left: 0; width: 10%; pointer-events: none; will-change: transform;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent), transparent); animation: scan 5s var(--clock) linear infinite; }
  html.motion .rk .tr i { position: relative; overflow: hidden; }
  html.motion .rk .tr i::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .65), transparent); animation: sweep 3.2s var(--clock) ease-in-out infinite; }
  html.motion .rk:nth-of-type(2n) .tr i::after { animation-delay: calc(var(--clock) + .8s); }
  html.motion .donut .ring { animation: breathe 4s var(--clock) ease-in-out infinite; }
  html.motion .donut .mid { z-index: 1; }
  /* A radar sweep around the donut's ring band only (the mask's band matches the stroke: r 15.9 ± 2.2 of 18). */
  html.motion .donut .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; animation: spin 3.5s var(--clock) linear infinite;
    background: conic-gradient(color-mix(in srgb, var(--accent) 55%, transparent), transparent 25%);
    -webkit-mask: radial-gradient(closest-side, transparent 75.5%, #000 76.5% 100%, transparent 101%); mask: radial-gradient(closest-side, transparent 75.5%, #000 76.5% 100%, transparent 101%); }
  html.motion .cal a.today { animation: ring 1.6s var(--clock) ease-out infinite; }
  html.motion .view.anim .cal a.today { animation: pop .4s both, ring 1.6s ease-out infinite; animation-delay: calc(.1s + var(--k, 0) * 12ms), var(--clock); }
  html.motion .live { animation: blink 2s ease-in-out infinite, ignite 2s ease-out infinite; animation-delay: var(--clock), var(--clock); }
  /* Cards: a holo sheen passes once as a page opens. Moving the background, not the layer, so no overflow: hidden is needed. */
  html.motion .card { position: relative; border-color: var(--card-line, var(--line)); }
  html.motion .view.anim .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, var(--sheen) 50%, transparent 60%) no-repeat; background-size: 250% 100%; animation: sheen .9s .6s ease-in-out both; }
  /* Tab bar: a light glides to the open tab (it jumps with reduce motion) */
  html:is(.motion, .still) #tabs::before { content: ''; position: absolute; top: -1px; left: 0; width: 20%; height: 3px; border-radius: 0 0 3px 3px;
    background: var(--accent); box-shadow: 0 0 8px var(--accent); translate: calc(var(--t, 0) * 100%) 0; }
  html.motion #tabs::before { transition: translate .45s cubic-bezier(.3, 1.4, .4, 1); }

  if (b) { go(b.dataset.go, true); return; }

    const rt = parseRoute();
    if (depth > 0) history.back();
    else go(`#/${PARENT[rt.name] || 'overview'}?${period(rt.q, rt).qs}`, true);  // opened from a link: go up instead of leaving
    return;
  }
  const sort = e.target.closest('[data-sort]')?.dataset.sort;
  if (sort) { state.merchSort = sort; render(); return; }
  if (e.target.id === 'toggle-ignored') { state.showIgnored = !state.showIgnored; render(); return; }
  const c = e.target.closest('#currency button')?.dataset.c;
  if (c && c !== state.currency) {
    state.currency = c; cache.set('currency', c); state.results = null;
    load().then(() => state.search && runSearch());
  }
});
// Listen on the document so rows in every list work.
document.addEventListener('change', e => {
  if (e.target.name === 'currency' && e.target.form?.dataset.kind === 'saving') {
    const gold = e.target.value === 'GOLD', f = e.target.form;
    f.querySelector('.karat').hidden = !gold;
    f.querySelector('.bal-label').textContent = gold ? 'Weight (grams)' : 'Balance';
  }
  if (e.target.name === 'category' && e.target.form.custom) e.target.form.querySelector('[name=custom]').parentElement.hidden = e.target.value !== '__new';
  if (e.target.id === 'day-pick' && okDay(e.target.value) && e.target.value <= today()) go(`#/day/${e.target.value}`, true);
  if (e.target.matches('.month-pick') && e.target.value) go(`#/${parseRoute().name}?m=${e.target.value}`, true);
  if (e.target.name === 'split') e.target.form.theirs.parentElement.hidden = e.target.value !== 'custom';
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.fix:not(.friend):not(.holding)')) return;  // leave the sign-out, friend and money forms alone
  e.preventDefault();
  const form = e.target, row = form.closest('details'), f = filterOf(parseRoute());
  const chosen = form.category.value === '__new' ? form.custom.value.trim() : form.category.value;
  if (!chosen) { (form.category.value === '__new' ? form.custom : form.category).focus(); return; }
  const all = form.all ? form.all.checked : false;
  form.querySelector('button').disabled = true;
  const wasReviewing = row.hasAttribute('data-unsure');
  // Saved ones leave the list the moment you tap Save (with "apply to all", every entry the rule covers does);
  // the server's answer then redraws the screen, or puts everything back if saving failed.
  // A re-sorted row stays in the full list, but leaves a category view it no longer belongs to.
  const leavesList = wasReviewing || NOT_COUNTED.has(chosen) || (f.category !== undefined && chosen !== f.category);
  const leaving = !leavesList ? [] : all
    ? [...document.querySelectorAll('details.txn')].filter(d => d.dataset.key === row.dataset.key && d.closest('#todo') === row.closest('#todo'))
    : [row];
  leaving.forEach(d => d.classList.add('leaving'));
  if (wasReviewing) {  // open the next one straight away instead of waiting for the server
    setTimeout(() => { leaving.forEach(d => d.remove()); reviewNext(); }, 250);
  }
  let reply;
  try {
    const r = await fetch(`/api/category?currency=${enc(state.currency)}`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: Number(row.dataset.id), category: chosen, whole_merchant: all }) });
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(r.status);
    reply = await r.json();
  } catch {
    toast('Could not save. Try again.');
    await load(true);  // brings back anything that was faded out
    return;
  }
  if (wasReviewing) await new Promise(ok => setTimeout(ok, 260));  // let the next one open first, so it stays open below
  const open = document.querySelector('details.txn[open]')?.dataset.id;  // keep the next one open across the redraw
  applyReply(reply, open);
  if (reply.category !== chosen) {  // saved, but something stronger still decides this one: say so instead of pretending
    toast(`Saved, but this one still shows as ${reply.category}. Open it again and untick "apply to all" to change just this one.`);
    return;
  }
  const done = chosen === OWN_TRANSFER ? 'Marked as own transfer' : 'Ignored';
  toast(NOT_COUNTED.has(chosen)
    ? (all ? `${done}, with ${row.dataset.merchant || 'similar messages'} from now on too.` : `${done}. It no longer counts.`)
    : (all ? `Saved. ${row.dataset.merchant || 'Similar messages'} ${row.dataset.merchant ? 'is' : 'are'} now ${chosen}, including future SMS.` : `Saved as ${chosen}.`));
});

// Redraw from a save's reply (it carries the whole updated dashboard), keeping an open row open.
function applyReply(reply, open) {
  pending = null;
  cache.set('s|' + reply.summary.currency, JSON.stringify(reply.summary)); cache.set('t|' + reply.summary.currency, JSON.stringify(reply.all));
  setData(reply.summary, reply.all);
  render();
  if (state.search) runSearch();  // refresh the results with the change
  if (open) document.querySelector(`details.txn[data-id="${open}"]`)?.setAttribute('open', '');
}
async function postAndRedraw(path, body, open) {
  try {
    const r = await fetch(`${path}?currency=${enc(state.currency)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) { location.href = '/login'; return false; }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    applyReply(await r.json(), open);
    return true;
  } catch (err) {
    toast(`Could not save: ${err.message}`);
    return false;
  }
}
async function saveFriend(form, remove) {
  const name = remove ? '' : form.friend.value.trim(), amount = Number(form.dataset.amount), split = form.split?.value;
  if (!remove && !name) { form.friend.focus(); return; }
  const theirs = !form.split ? 0 : split === 'all' ? amount / 100 : split === 'custom' ? form.theirs.value
    : Math.round(amount * (Number(split) - 1) / Number(split)) / 100;
  if (split === 'custom' && !remove && !form.theirs.value.trim()) { form.theirs.focus(); return; }
  form.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const email = remove ? '' : (form.email?.value || '').trim();
  const ok = await postAndRedraw('/api/friend', { id: Number(form.dataset.id), friend: name, theirs, email }, form.dataset.id);
  if (ok) {
    state.shared = null; await loadShared();
    const c = contactOf(name);
    toast(remove ? 'Friend tag removed.' : c?.app ? `Tagged with ${name} · ✓ linked: they see it in their app.`
      : c?.email ? `Tagged with ${name}. ${c.email} isn’t on this app yet: it links when the admin adds them.` : `Tagged with ${name}.`);
  }
  else form.querySelectorAll('button').forEach(b => { b.disabled = false; });
}
// While typing a friend's email: is it someone on this app? (Checked after a short pause.)
let linkTimer;
document.addEventListener('input', e => {
  if (e.target.name !== 'email' || !e.target.form?.matches('form.friend, form.contact')) return;
  const box = e.target.parentElement.querySelector('.link-status'), email = e.target.value.trim();
  clearTimeout(linkTimer);
  if (!box) return;
  box.textContent = ''; box.className = 'link-status';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) return;
  linkTimer = setTimeout(async () => {
    try {
      const r = await (await fetch(`/api/contact/check?email=${enc(email)}`)).json();
      if (e.target.value.trim() !== email) return;
      box.className = `link-status ${r.app ? 'ok' : 'no'}`;
      box.textContent = r.app ? '✓ Linked: they have an account here and will see what they owe.' : 'Not on this app yet. Saved anyway; it links when the admin adds them.';
    } catch {}
  }, 400);
});
document.addEventListener('input', e => {
  if (e.target.name !== 'friend' || !e.target.form?.matches('form.friend')) return;
  const box = e.target.form.querySelector('.friend-email'), name = e.target.value.trim();
  if (box) box.hidden = !name || !!contactOf(name)?.email;
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.account')) return;
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  if (f.dataset.act === 'password' && f.new.value !== f.again.value) { toast('The two new passwords don’t match.'); f.again.focus(); return; }
  btn.disabled = true;
  try {
    if (f.dataset.act === 'username') {
      const r = await post('/api/me/username', { username: f.username.value });
      state.me = { ...state.me, username: r.username }; toast(`Saved. Sign in with @${r.username} or your email.`);
    } else {
      await post('/api/me/password', { current: f.current.value, new: f.new.value }); f.reset(); toast('Password changed. Other devices are signed out.');
    }
    render();
  } catch (err) { btn.disabled = false; toast(`Not saved: ${err.message}`); }
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.contact')) return;
  e.preventDefault();
  const f = e.target;
  try { state.shared = await post('/api/contact', { name: f.name.value, email: f.email.value }); friendNames(); toast('Saved.'); render(); }
  catch { toast('Could not save: check the email.'); }
});
document.addEventListener('submit', e => {
  if (!e.target.matches('form.friend')) return;
  e.preventDefault();
  saveFriend(e.target, false);
});
document.addEventListener('click', async e => {
  const mo = e.target.closest('[data-motion]')?.dataset.motion;
  if (mo) { try { localStorage.setItem('motion', mo); } catch {} applyMotion(); render(); return; }
  if (e.target.closest('[data-unfriend]')) { saveFriend(e.target.closest('form'), true); return; }
  const unpeer = e.target.closest('[data-unpeer]');
  if (unpeer) {
    unpeer.disabled = true;
    if (await postAndRedraw('/api/peer/unlink', { id: Number(unpeer.dataset.unpeer) })) toast('Unlinked on both sides. It won’t be linked again.');
    else unpeer.disabled = false;
    return;
  }
  const del = e.target.closest('[data-delete]');
  if (del) {
    if (!confirm("Delete this transaction? It won't come back, even if the phone sends the SMS again.")) return;
    del.disabled = true;
    if (await postAndRedraw('/api/delete', { id: Number(del.dataset.delete) })) toast('Transaction deleted.');
    else del.disabled = false;
    return;
  }
  const settle = e.target.closest('[data-settle]');
  if (settle) {
    settle.disabled = true;
    if (await postAndRedraw('/api/friend/settle', { friend: settle.dataset.settle })) { toast(`Settled with ${settle.dataset.settle}.`); state.shared = null; loadShared(); }
    else settle.disabled = false;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Copied.'); } catch { toast('Copying is blocked here: press and hold the link to copy it.'); } return; }
  const net = e.target.closest('[data-settle-net]');
  if (net) {  // one payment of the difference squares both directions with this person
    if (!confirm(`Settle up with ${net.dataset.name}? Both what you owe them and what they owe you are marked settled.`)) return;
    net.disabled = true;
    try {
      await post('/api/shared/paid', { from: net.dataset.settleNet, currency: net.dataset.cur });
      const c = (state.shared?.contacts || []).find(x => x.email === net.dataset.settleNet);
      if (c) await post(`/api/friend/settle?currency=${enc(net.dataset.cur)}`, { friend: c.name });
      state.shared = null; await load(true); loadShared(); toast(`Settled up with ${net.dataset.name}.`);
    } catch { net.disabled = false; toast('Could not save. Try again.'); }
    return;
  }
  const paid = e.target.closest('[data-paid]');
  if (paid) {
    if (!confirm(`Mark everything you owe ${paid.dataset.name} in ${paid.dataset.cur} as paid? It shows as settled on their side too.`)) return;
    paid.disabled = true;
    try { state.shared = await post('/api/shared/paid', { from: paid.dataset.paid, currency: paid.dataset.cur }); toast(`Marked paid to ${paid.dataset.name}.`); render(); }
    catch { paid.disabled = false; toast('Could not save. Try again.'); }
  }
});

async function saveMoney(path, body) {
  try {
    const r = await fetch(`${path}?${moneyQs()}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) { location.href = '/login'; return false; }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    state.money = await r.json(); render();
    return true;
  } catch (err) { toast(`Could not save: ${err.message}`); return false; }
}
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.holding')) return;
  e.preventDefault();
  const f = e.target, data = Object.fromEntries(new FormData(f));
  f.querySelector('button').disabled = true;
  if (await saveMoney('/api/money', { ...data, id: f.dataset.id || null, kind: f.dataset.kind })) toast(f.dataset.id ? 'Saved.' : 'Added.');
  else f.querySelector('button').disabled = false;
});
document.addEventListener('click', async e => {
  const ci = e.target.closest('[data-closein]');
  if (ci) {
    const h = state.money.holdings.find(x => String(x.id) === ci.dataset.closein);
    if (h && await saveMoney('/api/money', holdingBody(h, { emi: ci.dataset.amt, as_of: h.as_of, balance: h.balance_minor / 100 }))) toast(`Planned: ${cash(ci.dataset.amt * 100, h.currency)} a month on ${h.name}.`);
    return;
  }
  const del = e.target.closest('[data-del-holding]');
  if (del && confirm('Delete this from your Money page?') && await saveMoney('/api/money/delete', { id: +del.dataset.delHolding })) toast('Deleted.');
});
let extraTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'extra') {
    clearTimeout(extraTimer);
    extraTimer = setTimeout(() => { state.extra = Math.max(0, parseInt(e.target.value.replace(/\D/g, ''), 10) || 0); ls.set('extraInr', state.extra); loadMoney(); }, 500);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'rate-gold') {
    const g = parseFloat(e.target.value);
    if (g > 0) { ls.set('goldInrG', g); ls.set('goldMine', '1'); } else { ls.del('goldMine'); ls.del('rateAt'); loadRate(); }
    loadMoney(); render(); return;
  }
  if (e.target.id === 'rate-usd') {
    const u = parseFloat(e.target.value);
    if (u > 0) { state.usd = u; ls.set('inrPerUsd', u); ls.set('usdMine', '1'); }
    else { ls.del('usdMine'); ls.del('rateAt'); loadRate(); }
    loadMoney(); render(); return;
  }
  if (e.target.id !== 'rate') return;
  const v = parseFloat(e.target.value);
  if (v > 0) { state.rate = v; ls.set('inrPerSar', v); ls.set('rateMine', '1'); }
  else { ls.del('rateMine'); ls.del('rateAt'); loadRate(); }
  render();
});

history.replaceState({ d: 0 }, '');
load();
</script>
