<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<title>Expenses</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f1f3; --line: #e6e7ea;
    --text: #0b0b0c; --text-2: #52514e; --muted: #77767a;
    --accent: #2a78d6; --accent-soft: #dbe8f8; --bar: #2a78d6; --bar-dim: #b7d3f6;
    --good: #0f7b3e; --bad: #b42318; --warn: #a15c00; --warn-soft: #fdf1dc;
    --hero-from: #1c5cab; --hero-to: #2a78d6; --hero-text: #ffffff; --hero-muted: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1012; --surface: #1a1a1c; --surface-2: #242427; --line: #2c2c30;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #93929a;
      --accent: #5598e7; --accent-soft: #1d3150; --bar: #3987e5; --bar-dim: #24456f;
      --good: #4ade80; --bad: #f87171; --warn: #f5b84a; --warn-soft: #3a2a0c;
      --hero-from: #104281; --hero-to: #1c5cab; --hero-text: #ffffff; --hero-muted: #b7d3f6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 16px; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* App bar */
  .bar { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .icon-btn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Hero */
  .hero { background: linear-gradient(135deg, var(--hero-from), var(--hero-to)); color: var(--hero-text); border-radius: 20px; padding: 18px 20px 20px; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav button { border: 0; background: rgb(255 255 255 / .16); color: inherit; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .month-nav button:disabled { opacity: .35; cursor: default; }
  .month-nav span { font-weight: 600; }
  .hero .label { color: var(--hero-muted); font-size: 13px; }
  .hero .total { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .hero .total small { font-size: 16px; font-weight: 600; margin-right: 6px; color: var(--hero-muted); }
  .hero .row { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; font-size: 14px; }
  .hero .row b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .delta { display: inline-block; margin-top: 6px; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: rgb(255 255 255 / .16); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h2 span { font-size: 13px; font-weight: 500; color: var(--muted); }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 680px) { .grid { grid-template-columns: 1fr 1fr; } }

  /* Category bars: labelled, so one hue is enough */
  .cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .cat { border: 0; background: none; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 10px; text-align: left; cursor: pointer; }
  .cat:hover { background: var(--surface-2); }
  .cat[aria-pressed="true"] { background: var(--accent-soft); }
  .cat-top .go { color: var(--muted); font-size: 16px; line-height: 1; }
  .filter { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .filter span { flex: 1; min-width: 0; }
  .filter button { border: 0; background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  .txn small .pen { color: var(--accent); }
  .cat-top { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .cat-top .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-top .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cat-top .pct { color: var(--muted); font-size: 12px; width: 36px; text-align: right; }
  .track { height: 6px; background: var(--surface-2); border-radius: 4px; margin: 6px 0 0 38px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
  .emoji { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 15px; }

  /* Trend */
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 18px; }
  .trend button { flex: 1; min-width: 0; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
  .trend .col { width: 100%; max-width: 40px; background: var(--bar-dim); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .trend button[aria-pressed="true"] .col { background: var(--bar); }
  .trend .col em { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 4px; font-style: normal; font-size: 11px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trend .m { font-size: 12px; color: var(--muted); }
  .trend button[aria-pressed="true"] .m { color: var(--text); font-weight: 600; }

  /* Lists */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li + li { border-top: 1px solid var(--line); }
  .merchant { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; }
  .merchant.cat { padding: 10px 8px; }
  .merchant span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .merchant span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  #accounts .merchant span:first-child { white-space: normal; }
  .day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 4px; }
  .day:first-of-type { margin-top: 0; }
  details.txn { border-top: 1px solid var(--line); }
  details.txn:first-of-type { border-top: 0; }
  details.txn summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
  details.txn summary::-webkit-details-marker { display: none; }
  .txn .emoji { width: 38px; height: 38px; border-radius: 12px; font-size: 18px; }
  .txn .who { flex: 1; min-width: 0; }
  .txn .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn .who small { color: var(--muted); font-size: 12px; }
  .txn .amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txn .amount.credit { color: var(--good); }
  .txn pre { margin: 0 0 12px 50px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }

  .txn small .fixme { color: var(--warn); font-weight: 600; }
  .todo { background: var(--warn-soft); border-radius: 12px; padding: 4px 12px; margin-bottom: 16px; }
  .todo h3 { font-size: 14px; margin: 8px 0 0; }
  .todo p { font-size: 13px; color: var(--text-2); margin: 2px 0 4px; }
  .todo details.txn { border-color: rgb(0 0 0 / .08); }
  .todo .fix { margin-left: 0; }
  .txn.leaving { opacity: 0; transition: opacity .25s; }
  .fix button { font-weight: 600; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  .fix { margin: 0 0 14px 50px; display: grid; gap: 10px; }
  .fix label { font-size: 13px; color: var(--text-2); }
  .fix select, .fix input[type=text] { width: 100%; margin-top: 4px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
  .fix .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
  .fix .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 4px 16px rgb(0 0 0 / .2); }
  .txn.ignored .who b, .txn.ignored .amount { color: var(--muted); text-decoration: line-through; }
  .link { border: 0; background: none; padding: 12px 0 4px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .phone-last { margin: 0 0 8px; font-size: 14px; }
  .delivery { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13px; color: var(--text-2); }
  .delivery .bad { color: var(--bad); font-weight: 600; }
  .search { width: 100%; font: inherit; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); }
  .stale { background: var(--bad); color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0; }
  .version { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .skeleton { opacity: .5; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>Expenses</h1>
    <div class="seg" id="currency" role="group" aria-label="Currency"></div>
    <a class="icon-btn" href="/import" aria-label="Import old SMS" title="Import old SMS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </a>
    <form method="post" action="/logout" onsubmit="cache.clear()">
      <button class="icon-btn" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </form>
  </div>

  <p class="stale" id="stale" role="alert" hidden></p>
  <section class="hero skeleton" id="hero" aria-live="polite">
    <div class="month-nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <span id="month-label">–</span>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="label">Spent</div>
    <div class="total" id="spent">–</div>
    <div id="delta"></div>
    <div class="row">
      <div><span class="label">Received</span><b id="received">–</b></div>
      <div><span class="label">Transactions</span><b id="count">–</b></div>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <h2>Where it went <span id="cat-total"></span></h2>
      <ul class="cats" id="cats"></ul>
    </section>
    <section class="card">
      <h2>Last 6 months <span>spent</span></h2>
      <div class="trend" id="trend"></div>
      <h2 style="margin-top:20px">Top merchants</h2>
      <ul class="rows" id="merchants"></ul>
      <h2 style="margin-top:20px">Cards &amp; accounts <span>spent</span></h2>
      <ul class="rows" id="accounts"></ul>
    </section>
  </div>

  <section class="card" id="txn-card">
    <h2>Transactions <span>tap to see SMS or fix</span></h2>
    <input type="search" id="search" class="search" placeholder="🔎 Search all SMS: merchant, amount, card, any word" aria-label="Search all SMS" autocomplete="off" enterkeyhint="search">
    <div id="todo"></div>
    <div id="filter"></div>
    <div id="txns"></div>
    <div id="ignored"></div>
  </section>
  <section class="card" id="phone">
    <h2>Phone connection <span>last 7 days</span></h2>
    <p class="phone-last" id="phone-last"></p>
    <ul class="rows" id="deliveries"></ul>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
  <p class="version" id="version"></p>
</main>
<script>
const ICONS = { 'Food': '🍔', 'Groceries': '🛒', 'Shopping': '🛍️', 'Transport': '🚗', 'Travel': '✈️', 'Bills & Utilities': '💡',
  'Subscriptions': '📺', 'Health': '💊', 'Entertainment': '🎬', 'Rent & EMI': '🏠', 'Investments': '📈', 'Insurance': '🛡️',
  'Cash': '💵', 'Salary': '💰', 'Income': '💰' };
const icon = c => ICONS[c] || '🧾';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// The last data seen is kept on this device so the dashboard paints instantly, then refreshes. Cleared on sign out.
const CACHE = 'expense:';
const cache = {
  get: k => { try { return localStorage.getItem(CACHE + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(CACHE + k, v); } catch {} },
  clear: () => { try { Object.keys(localStorage).filter(k => k.startsWith(CACHE)).forEach(k => localStorage.removeItem(k)); } catch {} },
};
// Session expired or signed out elsewhere: back to the login page.
const api = url => fetch(url).then(r => {
  if (r.status === 401) { cache.clear(); location.href = '/login'; return new Promise(() => {}); }
  if (!r.ok) throw new Error(`the server answered ${r.status}`);
  return r.text();
});
const monthName = (m, style = 'long') => new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', { month: style, year: 'numeric' });
const IGNORED = 'Ignored', OWN_TRANSFER = 'Own transfer', NOT_COUNTED = new Set([IGNORED, OWN_TRANSFER]);
const state = { month: '', currency: '', showIgnored: false, category: '', merchant: null, account: '', search: '', results: null, last: null };
// What a saved rule applies to, worked out the same way as the server: the merchant, or for a message
// with no merchant, its wording without numbers. Used to clear matching rows from the screen at once.
const ruleKey = t => t.merchant ? t.merchant.trim().toLowerCase()
  : 'sms:' + t.body.toLowerCase().replace(/[\d٠-٩][\d٠-٩,.:/*-]*/g, '#').split(/\s+/).filter(Boolean).join(' ');

let pending = null;  // fresh data that arrived while a transaction was open

async function load(force = false) {
  pending = null;
  const key = `${state.month}|${state.currency}`, cached = cache.get(key);
  if (cached) render(JSON.parse(cached));
  let fresh;
  try {
    fresh = await api(`/api/summary?month=${state.month}&currency=${state.currency}`);
    JSON.parse(fresh);
  } catch (err) {  // never pass off the saved copy as current
    $('stale').hidden = false;
    $('stale').textContent = `Couldn't refresh (${err.message}). ${cached ? 'You are seeing the last saved copy.' : ''} Pull down to try again.`;
    return;
  }
  $('stale').hidden = true;
  cache.set(key, fresh);
  if (fresh === cached) return;  // unchanged: leave the screen alone
  // A redraw would snap an open transaction (and its category menu) shut, so wait until it's closed.
  if (!force && document.querySelector('details.txn[open]')) { pending = fresh; return; }
  render(JSON.parse(fresh));
}

document.addEventListener('toggle', e => {
  if (pending && e.target.matches('details.txn') && !document.querySelector('details.txn[open]')) {
    const s = pending; pending = null; render(JSON.parse(s));
  }
}, true);

const ago = iso => {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  return min < 1 ? 'just now' : min < 60 ? `${min} min ago` : min < 1440 ? `${Math.round(min / 60)} h ago` : `${Math.round(min / 1440)} days ago`;
};

function render(s) {
  state.last = s;
  $('version').textContent = `Version ${s.version || 'unknown'}`;
  // Receipts for what the phone sent, so you can check a message arrived (and what happened to it).
  const deliveries = s.deliveries || [], last = deliveries[0];
  $('phone-last').innerHTML = last
    ? `Last SMS from your phone: <b>${ago(last.at)}</b> · ${esc(last.outcome)}`
    : '<span class="bad">No SMS from your phone in the last 7 days.</span> Check the forwarder app: the address, the password after "Bearer", and that Samsung isn\'t putting it to sleep.';
  $('deliveries').innerHTML = deliveries.map(d => `<li class="delivery"><span>${ago(d.at)} · ${esc(d.sender)}</span>` +
    `<span class="${d.outcome.startsWith('refused') ? 'bad' : ''}">${esc(d.outcome)}</span></li>`).join('');
  // Ignored ones are left out of everything and listed separately, so they can be brought back.
  // Ignored ones are hidden behind a link; uncategorized ones sit in "Needs a category" until you sort them.
  const counted = s.transactions.filter(t => !NOT_COUNTED.has(t.category));
  const txns = counted.filter(t => t.category !== 'Uncategorized'), ignored = s.transactions.filter(t => NOT_COUNTED.has(t.category));
  Object.assign(state, { month: s.month, currency: s.currency });
  const num = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = n => `${s.currency} ${num.format(n)}`;
  const short = n => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : Math.round(n);

  // Currency switch: SAR first.
  const currencies = [...new Set(['SAR', ...s.currencies])];
  $('currency').innerHTML = currencies.map(c => `<button type="button" aria-pressed="${c === s.currency}" data-c="${c}">${c}</button>`).join('');

  // Hero
  const months = s.months.map(m => m.month);
  if (!months.includes(s.month)) months.push(s.month);
  months.sort();
  const i = months.indexOf(s.month);
  $('prev').disabled = i <= 0; $('next').disabled = i >= months.length - 1;
  $('prev').onclick = () => { state.month = months[i - 1]; load(); };
  $('next').onclick = () => { state.month = months[i + 1]; load(); };
  $('month-label').textContent = monthName(s.month);
  const cur = s.months.find(m => m.month === s.month) || { spent: 0, received: 0 };
  const prev = s.months.find(m => m.month === months[i - 1]);
  $('spent').innerHTML = `<small>${s.currency}</small>${num.format(cur.spent)}`;
  $('received').textContent = money(cur.received);
  $('count').textContent = counted.length;
  if (prev && prev.spent > 0) {
    const pct = Math.round((cur.spent - prev.spent) / prev.spent * 100);
    $('delta').innerHTML = `<span class="delta">${pct > 0 ? '▲' : pct < 0 ? '▼' : '='} ${Math.abs(pct)}% ${pct > 0 ? 'more' : pct < 0 ? 'less' : 'same'} than ${monthName(prev.month, 'short').split(' ')[0]}</span>`;
  } else $('delta').innerHTML = '';
  $('hero').classList.remove('skeleton');

  // Categories
  const cats = Object.entries(s.by_category);
  const totalSpent = cats.reduce((a, [, v]) => a + v, 0);
  $('cat-total').textContent = cats.length ? `${cats.length} categories` : '';
  $('cats').innerHTML = cats.map(([c, v]) => {
    const pct = totalSpent ? v / totalSpent * 100 : 0;
    return `<li><button type="button" class="cat" data-cat="${esc(c)}" aria-pressed="${c === state.category}" aria-label="Show ${esc(c)} transactions">` +
      `<div class="cat-top"><span class="emoji" aria-hidden="true">${icon(c)}</span><span class="name">${esc(c)}</span>` +
      `<span class="amt">${money(v)}</span><span class="pct">${Math.round(pct)}%</span><span class="go" aria-hidden="true">›</span></div>` +
      `<div class="track" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></div></button></li>`;
  }).join('') || '<li class="empty">No spending this month</li>';

  // Trend: last 6 months up to the selected one; tap a bar to open that month.
  const window6 = months.slice(Math.max(0, i - 5), i + 1);
  const spentOf = m => (s.months.find(x => x.month === m) || { spent: 0 }).spent;
  const max = Math.max(...window6.map(spentOf), 1);
  $('trend').innerHTML = window6.map(m => {
    const v = spentOf(m);
    return `<button type="button" data-m="${m}" aria-pressed="${m === s.month}" aria-label="${monthName(m)}: ${money(v)}" title="${monthName(m)}: ${money(v)}">` +
      `<div class="col" style="height:${Math.max(v / max * 100, 1.5).toFixed(1)}%"><em>${short(v)}</em></div>` +
      `<span class="m">${monthName(m, 'short').split(' ')[0]}</span></button>`;
  }).join('');

  // Merchants
  $('merchants').innerHTML = Object.entries(s.top_merchants).slice(0, 5)
    .map(([m, v]) => `<li><button type="button" class="merchant cat" data-merchant="${esc(m)}" aria-pressed="${state.merchant === (m === '(unknown)' ? '' : m)}" aria-label="Show ${esc(m)} transactions">` +
      `<span>${esc(m)}</span><span>${money(v)} <span class="go" aria-hidden="true">›</span></span></button></li>`).join('')
    || '<li class="empty">No merchants yet</li>';
  $('accounts').innerHTML = Object.entries(s.by_account || {})
    .map(([a, v]) => `<li><button type="button" class="merchant cat" data-account="${esc(a)}" aria-pressed="${state.account === a}" aria-label="Show ${esc(a)} transactions">` +
      `<span>💳 ${esc(a)}</span><span>${money(v)} <span class="go" aria-hidden="true">›</span></span></button></li>`).join('')
    || '<li class="empty">No card spending yet</li>';

  // Transactions grouped by day (dates are the phone's local time, so read them from the string as-is).
  const today = new Date(), iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  const dayLabel = d => d === iso(today) ? 'Today' : d === iso(yest) ? 'Yesterday'
    : new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const row = (t, withDate) => {
    const unsure = t.category === 'Uncategorized', ignored = NOT_COUNTED.has(t.category);
    const options = s.categories.map(c => `<option ${c === t.category ? 'selected' : ''}>${esc(c)}</option>`).join('');
    return `<details class="txn${ignored ? ' ignored' : ''}" data-id="${t.id}" data-merchant="${esc(t.merchant)}" data-key="${esc(ruleKey(t))}" ${unsure ? 'data-unsure' : ''}>` +
      `<summary><span class="emoji" aria-hidden="true">${t.category === OWN_TRANSFER ? '🔁' : ignored ? '🚫' : icon(t.category)}</span>` +
      `<span class="who"><b>${esc(t.merchant || 'Unknown merchant')}</b><small>${unsure ? '<span class="fixme">Needs a category</span>' : ignored ? `${t.category === OWN_TRANSFER ? 'Own transfer' : 'Ignored'}, not counted` : `${esc(t.category)} <span class="pen" aria-hidden="true">✎</span>`} · ${withDate ? dayLabel(t.received_at.slice(0, 10)) + ', ' : ''}${t.received_at.slice(11, 16)}<br>💳 ${esc(t.account)}</small></span>` +
      `<span class="amount ${t.direction}">${t.direction === 'debit' ? '−' : '+'}${money(t.amount)}</span></summary>` +
      `<pre>${esc(t.body)}</pre>` +
      `<form class="fix"><label>${unsure ? 'Category' : 'Wrong category? Choose the right one'}<select name="category">${unsure ? '<option value="" selected disabled>Choose…</option>' : ''}${options}` +
      `<option value="__new">+ New category…</option><option value="${OWN_TRANSFER}" ${t.category === OWN_TRANSFER ? 'selected' : ''}>🔁 Own transfer (don't count)</option>` +
      `<option value="${IGNORED}" ${t.category === IGNORED ? 'selected' : ''}>🚫 Ignore (don't count)</option></select></label>` +
      `<label hidden>New category name<input type="text" name="custom" maxlength="40" autocomplete="off"></label>` +
      `<label class="check"><input type="checkbox" name="all" checked>${t.merchant ? `Apply to all from ${esc(t.merchant)}` : 'Apply to all similar messages'}, including future SMS</label>` +
      `<div><button>Save</button></div></form></details>`;
  };
  // Tapping a category in "Where it went" narrows the list to it.
  // Tapping a merchant in "Top merchants" does the same for that merchant.
  const filtering = state.category || state.merchant !== null || state.account;
  // A filtered view includes not-yet-sorted ones too, so its list adds up to the total you tapped.
  const shown = state.category ? counted.filter(t => t.category === state.category)
    : state.merchant !== null ? counted.filter(t => t.merchant === state.merchant)
    : state.account ? counted.filter(t => t.account === state.account) : txns;
  const shownTotal = shown.reduce((a, t) => a + (t.direction === 'debit' ? t.amount : 0), 0);
  const label = state.category ? `${icon(state.category)} <b>${esc(state.category)}</b>`
    : state.account ? `💳 <b>${esc(state.account)}</b>` : `🏪 <b>${esc(state.merchant || 'Unknown merchant')}</b>`;
  $('filter').innerHTML = filtering ? `<div class="filter"><span>${label} · ` +
    `${shown.length} transaction${shown.length === 1 ? '' : 's'} · ${money(shownTotal)}</span><button type="button" id="clear-filter">✕ Show all</button></div>` : '';
  let lastDay = '';
  $('txns').innerHTML = shown.map(t => {
    const day = t.received_at.slice(0, 10), header = day !== lastDay ? `<div class="day">${dayLabel(day)}</div>` : '';
    lastDay = day;
    return header + row(t, false);
  }).join('') || (filtering ? `<div class="empty"><b>Nothing here in ${monthName(s.month)}</b></div>` : '') || `<div class="empty"><b>No transactions in ${monthName(s.month)}</b>New bank SMS will appear here within seconds once your phone forwards them.<br><a href="/import" style="color:var(--accent);font-weight:600">Import your old SMS</a></div>`;
  $('ignored').innerHTML = ignored.length
    ? `<button type="button" class="link" aria-expanded="${state.showIgnored}" id="toggle-ignored">${state.showIgnored ? 'Hide' : 'Show'} ${ignored.length} not counted (own transfers &amp; ignored)</button>` +
      (state.showIgnored ? ignored.map(t => row(t, true)).join('') : '')
    : '';
  const todo = s.to_review;
  $('todo').innerHTML = todo.length && !filtering ? `<div class="todo"><h3>Needs a category · ${todo.length}</h3>` +
    `<p>Tap one, pick a category and save. It moves to your list.</p>${todo.map(t => row(t, true)).join('')}</div>` : '';
  if (state.results) {  // searching: matches from every month replace this month's list
    const r = state.results;
    $('todo').innerHTML = ''; $('ignored').innerHTML = '';
    $('filter').innerHTML = `<div class="filter"><span>🔎 <b>“${esc(state.search)}”</b> · ${r.count} result${r.count === 1 ? '' : 's'}` +
      `${r.count > r.results.length ? ` (newest ${r.results.length} shown)` : ''} · ${money(r.spent)} spent</span><button type="button" id="clear-search">✕ Clear</button></div>`;
    $('txns').innerHTML = r.results.map(t => row(t, true)).join('')
      || `<div class="empty"><b>No SMS match “${esc(state.search)}”</b>Try one word, a merchant name, an amount or a card's last 4 digits.</div>`;
  }
}

let searchTimer;
async function runSearch() {
  const q = $('search').value.trim();
  state.search = q;
  if (!q) { state.results = null; if (state.last) render(state.last); return; }
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&currency=${state.currency}`);
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(r.status);
    const found = await r.json();
    if (state.search !== q) return;  // you kept typing; a newer search is on its way
    state.results = found;
    render(state.last);
  } catch { toast('Search failed. Try again.'); }
}
$('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 300); });

function reviewNext() {
  const next = document.querySelector('#todo details.txn');
  if (!next) return;
  next.open = true;
  next.scrollIntoView({ behavior: 'smooth', block: 'center' });
  next.querySelector('select').focus({ preventScroll: true });
}

function toast(text) {
  $('toast').textContent = text; $('toast').hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { $('toast').hidden = true; }, 3500);
}

$('cats').addEventListener('click', e => {
  const c = e.target.closest('.cat')?.dataset.cat;
  if (c === undefined) return;
  Object.assign(state, { category: state.category === c ? '' : c, merchant: null, account: '' });
  load();
  $('txn-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('merchants').addEventListener('click', e => {
  const m = e.target.closest('.merchant')?.dataset.merchant;
  if (m === undefined) return;
  const merchant = m === '(unknown)' ? '' : m;
  Object.assign(state, { merchant: state.merchant === merchant ? null : merchant, category: '', account: '' });
  load();
  $('txn-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('filter').addEventListener('click', e => {
  if (e.target.id === 'clear-filter') { Object.assign(state, { category: '', merchant: null, account: '' }); load(); }
  if (e.target.id === 'clear-search') { $('search').value = ''; runSearch(); }
});
$('accounts').addEventListener('click', e => {
  const a = e.target.closest('[data-account]')?.dataset.account;
  if (a === undefined) return;
  Object.assign(state, { account: state.account === a ? '' : a, category: '', merchant: null });
  load();
  $('txn-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('ignored').addEventListener('click', e => {
  if (e.target.id === 'toggle-ignored') { state.showIgnored = !state.showIgnored; load(); }
});
// Listen on the document so rows in both the main list and the ignored list work.
document.addEventListener('change', e => {
  if (e.target.name === 'category') e.target.form.querySelector('[name=custom]').parentElement.hidden = e.target.value !== '__new';
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.fix')) return;  // leave the sign-out form alone
  e.preventDefault();
  const form = e.target, row = form.closest('details');
  const chosen = form.category.value === '__new' ? form.custom.value.trim() : form.category.value;
  if (!chosen) { (form.category.value === '__new' ? form.custom : form.category).focus(); return; }
  const all = form.all ? form.all.checked : false;
  form.querySelector('button').disabled = true;
  const wasReviewing = row.hasAttribute('data-unsure');
  // Saved ones leave the list the moment you tap Save (with "apply to all", every entry the rule covers does);
  // the server's answer then redraws the screen, or puts everything back if saving failed.
  // A re-sorted row stays in the full list, but leaves a category view it no longer belongs to.
  const leavesList = wasReviewing || NOT_COUNTED.has(chosen) || (state.category && chosen !== state.category);
  const leaving = !leavesList ? [] : all
    ? [...document.querySelectorAll('details.txn')].filter(d => d.dataset.key === row.dataset.key && d.closest('#todo') === row.closest('#todo'))
    : [row];
  leaving.forEach(d => d.classList.add('leaving'));
  if (wasReviewing) {  // open the next one straight away instead of waiting for the server
    setTimeout(() => { leaving.forEach(d => d.remove()); reviewNext(); }, 250);
  }
  let reply;
  try {
    const r = await fetch(`/api/category?month=${state.month}&currency=${state.currency}`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: Number(row.dataset.id), category: chosen, whole_merchant: all }) });
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(r.status);
    reply = await r.json();
  } catch {
    toast('Could not save. Try again.');
    await load(true);  // brings back anything that was faded out
    return;
  }
  const open = document.querySelector('details.txn[open]')?.dataset.id;  // keep the next one open across the redraw
  cache.set(`${state.month}|${state.currency}`, JSON.stringify(reply.summary));
  render(reply.summary);
  if (state.search) runSearch();  // refresh the results with the new category
  if (open) document.querySelector(`details.txn[data-id="${open}"]`)?.setAttribute('open', '');
  if (reply.category !== chosen) {  // saved, but something stronger still decides this one: say so instead of pretending
    toast(`Saved, but this one still shows as ${reply.category}. Open it again and untick "apply to all" to change just this one.`);
    return;
  }
  const done = chosen === OWN_TRANSFER ? 'Marked as own transfer' : 'Ignored';
  toast(NOT_COUNTED.has(chosen)
    ? (all ? `${done}, with ${row.dataset.merchant || 'similar messages'} from now on too.` : `${done}. It no longer counts.`)
    : (all ? `Saved. ${row.dataset.merchant || 'Similar messages'} ${row.dataset.merchant ? 'is' : 'are'} now ${chosen}, including future SMS.` : `Saved as ${chosen}.`));
});

$('currency').addEventListener('click', e => {
  const c = e.target.closest('button')?.dataset.c;
  if (c && c !== state.currency) { Object.assign(state, { currency: c, month: '', category: '', merchant: null, account: '' }); load().then(() => state.search && runSearch()); }
});
$('trend').addEventListener('click', e => {
  const m = e.target.closest('button')?.dataset.m;
  if (m && m !== state.month) { state.month = m; load(); }
});
load();
</script>
</body>
</html>
