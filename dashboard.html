<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<title>Expenses</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f1f3; --line: #e6e7ea;
    --text: #0b0b0c; --text-2: #52514e; --muted: #77767a;
    --accent: #2a78d6; --accent-soft: #dbe8f8; --bar: #2a78d6; --bar-dim: #b7d3f6; --bar-2: #12a37a;
    --good: #0f7b3e; --bad: #b42318; --warn: #a15c00; --warn-soft: #fdf1dc;
    --hero-from: #1c5cab; --hero-to: #2a78d6; --hero-text: #ffffff; --hero-muted: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1012; --surface: #1a1a1c; --surface-2: #242427; --line: #2c2c30;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #93929a;
      --accent: #5598e7; --accent-soft: #1d3150; --bar: #3987e5; --bar-dim: #24456f; --bar-2: #34c392;
      --good: #4ade80; --bad: #f87171; --warn: #f5b84a; --warn-soft: #3a2a0c;
      --hero-from: #104281; --hero-to: #1c5cab; --hero-text: #ffffff; --hero-muted: #b7d3f6;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(88px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  button, select, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  h1:focus { outline: none; }
  .num, .v, .total, .kpis b { font-variant-numeric: tabular-nums; }

  /* App bar */
  .appbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: env(safe-area-inset-top) 4px 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .appbar.drill { padding-left: 4px; }
  .appbar.nocur #currency { display: none; }  /* a detail page keeps the currency it was opened in; the title needs the room */
  .titles { flex: 1; min-width: 0; }
  .titles h1 { font-size: 20px; line-height: 1.2; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drill .titles h1 { font-size: 17px; }
  .titles .sub { margin: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; flex: none; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; min-height: 32px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .icon-btn { flex: none; border: 0; background: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); text-decoration: none; }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Bottom tabs */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { position: relative; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); text-decoration: none; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar a[aria-current="page"], .tabbar a.on { color: var(--accent); font-weight: 600; }
  .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }

  /* Period chips: the only horizontal scroller */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: -4px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips a { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .chips a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Hero */
  .hero { background: linear-gradient(135deg, var(--hero-from), var(--hero-to)); color: var(--hero-text); border-radius: 16px; padding: 12px 16px 16px; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .month-nav button { flex: none; border: 0; background: rgb(255 255 255 / .16); color: inherit; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1; }
  .month-nav button:disabled { opacity: .35; cursor: default; }
  .month-nav span { min-width: 0; text-align: center; font-weight: 600; font-size: 15px; }
  .month-nav small { display: block; font-weight: 500; font-size: 12px; color: var(--hero-muted); }
  .hero .label { color: var(--hero-muted); font-size: 13px; }
  .hero .total { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .hero .total small { font-size: 15px; font-weight: 600; margin-right: 6px; color: var(--hero-muted); }
  .hero .refunds { font-size: 13px; color: var(--hero-muted); margin-top: 4px; }
  .delta { display: inline-block; margin-top: 4px; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: rgb(255 255 255 / .16); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 16px; }
  .kpis div { min-width: 0; }
  .kpis span { display: block; font-size: 12px; color: var(--hero-muted); }
  .kpis b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / .2); font-size: 13px; }
  .proj b { font-variant-numeric: tabular-nums; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 17px; margin: 0 0 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
  .card h2 > span { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card h2 + .card-sub { margin: -4px 0 8px; font-size: 13px; color: var(--muted); }
  .more { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: none; }
  .banner { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border-radius: 16px; background: var(--warn-soft); color: var(--text); text-decoration: none; font-weight: 600; }
  .banner span { flex: 1; }
  .banner .go, .ln .go { color: var(--muted); font-size: 20px; }

  /* Ranked bar row */
  .rk { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 40px; grid-template-rows: auto 4px; column-gap: 12px; row-gap: 6px; align-items: center; min-height: 56px; padding: 8px 0; text-decoration: none; color: inherit; }
  .rk + .rk, .sublink + .rk { border-top: 1px solid var(--line); }
  .rk .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; }
  .rk .nm { min-width: 0; }
  .rk .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .nm small, .rk .v small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .v { text-align: right; font-weight: 600; white-space: nowrap; }
  .rk .pc { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rk .tr { grid-column: 2 / -1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .rk .tr i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
  .acct { display: flex !important; min-width: 0; }
  .acct span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct span:last-child { flex: none; padding-left: 4px; }
  .up { color: var(--bad) !important; } .down { color: var(--good) !important; }
  .sublink { display: inline-flex; align-items: center; min-height: 44px; margin: -8px 0 0 44px; color: var(--warn); font-weight: 600; font-size: 13px; text-decoration: none; }

  /* Link rows (Insights, settings) */
  .ln { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; text-decoration: none; color: inherit; }
  .ln + .ln { border-top: 1px solid var(--line); }
  .ln .nm { flex: 1; min-width: 0; }
  .ln .nm b { display: block; font-weight: 600; }
  .ln .nm small { display: block; font-size: 12px; color: var(--muted); }
  .ln .v { font-weight: 600; white-space: nowrap; }

  /* Bars */
  .bars { display: flex; align-items: stretch; gap: 4px; height: 128px; }
  .bars.mini { height: 64px; margin-top: 12px; }
  .bars > * { flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
  .bars .area { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
  .bars .col { flex: 1; max-width: 28px; min-height: 2px; background: var(--bar-dim); border-radius: 3px 3px 0 0; }
  .bars .col.r { background: var(--bar-2); }
  .bars .sel .col:not(.r) { background: var(--bar); }
  .bars .m { height: 18px; font-size: 12px; line-height: 18px; text-align: center; color: var(--muted); overflow: hidden; }
  .bars .sel .m { color: var(--text); font-weight: 600; }
  .bars.days { gap: 2px; }
  .bars.days .col { max-width: none; }
  .legend { display: flex; gap: 16px; margin: 0 0 8px; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  /* Drill-down summary */
  .big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  .big b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 12px 0 0; }
  .stats div { min-width: 0; }
  .stats dt { font-size: 12px; color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Transactions */
  .day { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 4px; }
  .day:first-child { margin-top: 0; }
  .day a { text-decoration: none; display: inline-flex; align-items: center; min-height: 32px; }
  .day span { font-variant-numeric: tabular-nums; }
  details.txn { border-top: 1px solid var(--line); }
  .day + details.txn { border-top: 0; }
  details.txn summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 56px; cursor: pointer; }
  details.txn summary::-webkit-details-marker { display: none; }
  .emoji { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 17px; }
  .txn .who { flex: 1; min-width: 0; }
  .txn .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn .who small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn small .pen { color: var(--accent); }
  .txn .amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txn .amount.credit { color: var(--good); }
  .txn pre { margin: 0 0 12px 50px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
  .txn small .fixme { color: var(--warn); font-weight: 600; }
  .todo { background: var(--warn-soft); border-radius: 16px; padding: 4px 12px; }
  .todo h2 { font-size: 15px; margin: 8px 0 0; }
  .todo p { font-size: 13px; color: var(--text-2); margin: 2px 0 4px; }
  .todo details.txn { border-color: rgb(0 0 0 / .08); }
  .txn.leaving { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) { .txn.leaving { transition: opacity .25s; } }
  .fix button, .btn { font-weight: 600; border: 0; border-radius: 10px; min-height: 44px; padding: 8px 16px; background: var(--accent); color: #fff; cursor: pointer; }
  .fix { margin: 0 0 16px 50px; display: grid; gap: 12px; min-width: 0; overflow-wrap: anywhere; }  /* a one-word 40-letter merchant must wrap, not widen the page */
  .fix label { font-size: 13px; color: var(--text-2); }
  .fix select, .fix input[type=text] { width: 100%; min-height: 44px; margin-top: 4px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
  .fix .check { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text); min-height: 44px; }
  .fix .check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
  .txn.ignored .who b, .txn.ignored .amount { color: var(--muted); text-decoration: line-through; }
  .link { border: 0; background: none; min-height: 44px; padding: 8px 0; color: var(--accent); font-weight: 600; cursor: pointer; }
  .toast { position: fixed; z-index: 20; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 15px; box-shadow: 0 4px 16px rgb(0 0 0 / .2); }

  .phone-last { margin: 0 0 8px; font-size: 15px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li + li { border-top: 1px solid var(--line); }
  .skipped > summary { list-style: none; cursor: pointer; }
  .skipped > summary::-webkit-details-marker { display: none; }
  .skipped .link-ish { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .skipped pre { margin: 0 0 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
  .keep { display: grid; gap: 10px; margin-bottom: 14px; }
  .keep label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); min-width: 0; }
  .keep input, .keep select { font: inherit; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); width: 100%; }
  .keep-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .delivery { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13px; color: var(--text-2); }
  .delivery span:last-child { text-align: right; }
  .bad { color: var(--bad); font-weight: 600; }
  .search { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); }
  .filter { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  .stale { background: var(--bad); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 15px; margin: 0; }
  .version { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 15px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  .empty a { color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }
  h3.sec { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 0; }
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <button class="icon-btn" type="button" id="back" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="titles"><h1 id="title" tabindex="-1">Overview</h1><p class="sub" id="sub" hidden></p></div>
  <div class="seg" id="currency" role="group" aria-label="Currency"></div>
  <a class="icon-btn" href="#/search" aria-label="Search all SMS" title="Search all SMS">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </a>
  <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </a>
</header>
<main>
  <p class="stale" id="stale" role="alert" hidden></p>
  <div class="view" id="view"></div>
</main>
<nav class="tabbar" aria-label="Main" id="tabs"></nav>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const ICONS = { 'Food': '🍔', 'Groceries': '🛒', 'Shopping': '🛍️', 'Transport': '🚗', 'Travel': '✈️', 'Bills & Utilities': '💡',
  'Subscriptions': '📺', 'Health': '💊', 'Entertainment': '🎬', 'Rent & EMI': '🏠', 'Investments': '📈', 'Insurance': '🛡️',
  'Cash': '💵', 'Salary': '💰', 'Income': '💰', 'Uncategorized': '❔' };
const icon = c => ICONS[c] || '🧾';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const enc = encodeURIComponent;
// The last data seen is kept on this device so the dashboard paints instantly, then refreshes. Cleared on sign out.
const CACHE = 'expense:';
const cache = {
  get: k => { try { return localStorage.getItem(CACHE + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(CACHE + k, v); } catch {} },
  clear: () => { try { Object.keys(localStorage).filter(k => k.startsWith(CACHE)).forEach(k => localStorage.removeItem(k)); } catch {} },
};
// Session expired or signed out elsewhere: back to the login page.
const api = url => fetch(url).then(async r => {
  if (r.status === 401) { cache.clear(); location.href = '/login'; return new Promise(() => {}); }
  if (!r.ok) {  // include the server's reason, so a screenshot of the error bar says what broke
    const why = await r.json().then(j => j.error).catch(() => '');
    throw new Error(`the server answered ${r.status}${why ? `: ${why}` : ''}`);
  }
  return r.text();
});
const IGNORED = 'Ignored', OWN_TRANSFER = 'Own transfer', NOT_COUNTED = new Set([IGNORED, OWN_TRANSFER]);
const INCOME = new Set(['Salary', 'Income']);
const FIXED = new Set(['Rent & EMI', 'Bills & Utilities', 'Subscriptions', 'Insurance', 'Investments']);
const LARGE_MIN = { SAR: 200, INR: 5000 }, LARGE_SKIP = new Set(['Rent & EMI', 'Investments']);
const smooth = matchMedia('(prefers-reduced-motion: no-preference)').matches ? 'smooth' : 'auto';
const state = { currency: cache.get('currency') || '', sum: null, all: [], showIgnored: false, merchSort: 'spent', search: '', results: null };
// What a saved rule applies to, worked out the same way as the server: the merchant, or for a message
// with no merchant, its wording without numbers. Used to clear matching rows from the screen at once.
const ruleKey = t => t.merchant ? t.merchant.trim().toLowerCase()
  : 'sms:' + t.body.toLowerCase().replace(/[\d٠-٩][\d٠-٩,.:/*-]*/g, '#').split(/\s+/).filter(Boolean).join(' ');

/* ---------- Numbers and dates (amounts are kept in minor units so sums don't drift) ---------- */
const num = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = c => (c < 0 ? '−' : '') + num.format(Math.abs(c) / 100);
const money = c => `${state.currency} ${fmt(c)}`;
const short = c => { const n = Math.abs(c) / 100; return (c < 0 ? '−' : '') + (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : Math.round(n)); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pad = n => String(n).padStart(2, '0');

// Payments that repeat at a steady interval and amount (see the definitions in the README of this change).
function recurring(all) {

  }

    const gaps = list.slice(1).map((t, i) => dayNum(t._d) - dayNum(list[i]._d)), G = median(gaps);
    const cadence = G >= 6 && G <= 8 ? 'Weekly' : G >= 27 && G <= 33 ? 'Monthly' : G >= 355 && G <= 375 ? 'Yearly' : '';
    const amounts = list.map(t => t._c), A = median(amounts);

        || amounts.filter(a => Math.abs(a - A) <= A * .15).length < amounts.length * .75) continue;
    const last = list[list.length - 1], lastN = dayNum(last._d);

let pending = null, loadSeq = 0;  // pending: fresh data that arrived while a transaction was open
function setData(sum, all) {

  state.earliest = state.all.reduce((a, t) => t._d < a ? t._d : a, today());
}
// Keep the screen current without a manual refresh: ask "anything new?" when the app comes back to the
// foreground and every 30 s while it's on screen (never in the background), and reload only when there is.
let seen = null;
async function checkForNew() {
  if (document.hidden) return;
  try {
    const r = await fetch('/api/latest');
    if (!r.ok) return;
    const now = await r.json(), before = seen;
    seen = now;
    if (!before || (now.count === before.count && now.last_id === before.last_id)) return;
    await load();
    const added = now.count - before.count;
    if (added > 0) toast(`${added} new transaction${added === 1 ? '' : 's'}`);
  } catch {}  // offline: try again on the next tick
}
setInterval(checkForNew, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForNew(); });
addEventListener('pageshow', checkForNew);

async function load(force = false) {
  pending = null;
  const seq = ++loadSeq, C = state.currency;
  const cs = C && cache.get('s|' + C), ct = C && cache.get('t|' + C);
  let painted = false;
  if (cs && ct) try { setData(JSON.parse(cs), JSON.parse(ct)); painted = true; } catch {}
  if (!painted) { state.sum = null; state.all = []; }
  render();
  let s, t, sum, all;
  try {
    if (C) [s, t] = await Promise.all([api(`/api/summary?currency=${enc(C)}`), api(`/api/transactions?currency=${enc(C)}`)]);
    else { s = await api('/api/summary'); t = await api(`/api/transactions?currency=${enc(JSON.parse(s).currency)}`); }
    sum = JSON.parse(s); all = JSON.parse(t);
  } catch (err) {  // never pass off the saved copy as current
    if (seq !== loadSeq) return;
    $('stale').hidden = false;

    if (!painted) { state.failed = true; render(); }

}
function searchPage() {
  return { title: 'Search', html: `<section class="card"><input type="search" id="search" class="search" placeholder="Merchant, amount, card, any word" aria-label="Search all SMS" autocomplete="off" enterkeyhint="search" value="${esc(state.search)}"><div id="results"></div></section>` };
}
function renderResults() {
  const r = state.results;
  $('results').innerHTML = !state.search ? '<p class="muted">Searches every month’s SMS.</p>' : !r ? '<p class="muted">Searching…</p>'
    : `<p class="filter">“${esc(state.search)}” · ${plural(r.count, 'result')}${r.count > r.results.length ? ` (newest ${r.results.length} shown)` : ''} · ${money(Math.round(r.spent * 100))} spent</p>` +
      (prep(r.results).map(t => row(t, true)).join('') || empty(`No SMS match “${esc(state.search)}”`, "Try one word, a merchant name, an amount or a card's last 4 digits."));
}
const PAGES = { overview, categories, merchants, cards, activity,
  category: (r, P, X) => drill(r, P, X, 'category'), merchant: (r, P, X) => drill(r, P, X, 'merchant'), card: (r, P, X) => drill(r, P, X, 'card'),
  month: (r, P, X) => drill(r, P, X, 'month'), day: (r, P, X) => drill(r, P, X, 'day'), cash: (r, P, X) => drill(r, P, X, 'cash'),
  trends, income, recurring: recurringPage, large: largePage, search: searchPage, settings };
const TITLES = Object.fromEntries(TABS.map(([k, label]) => [k, label]));

function render() {
  const rt = parseRoute(), P = period(rt.q, rt), isTab = rt.name in TITLES;
  const changed = rt.hash !== lastHash; lastHash = rt.hash;
  // Currency switch: SAR first.
  const currencies = [...new Set(['SAR', ...(state.sum?.currencies || []), state.currency].filter(Boolean))];
  $('currency').innerHTML = currencies.map(c => `<button type="button" aria-pressed="${c === state.currency}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const review = state.sum?.to_review.length || 0, parent = isTab ? rt.name : PARENT[rt.name] || 'overview';
  $('tabs').innerHTML = TABS.map(([k, label, svg]) => `<a href="#/${k}?${P.qs}" data-replace ${k === rt.name ? 'aria-current="page"' : ''} class="${k === parent ? 'on' : ''}">` +
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg}</svg>${label}` +
    (k === 'activity' && review ? `<span class="badge" aria-label="${review} need a category">${review > 99 ? '99+' : review}</span>` : '') + '</a>').join('');
  if (rt.name === 'search' && $('search') && !changed) { renderResults(); return; }  // keep the box (and keyboard) while typing
  let page;
  if (!state.sum) page = { html: `<section class="card">${state.failed ? empty("Couldn't load your data", 'Check your connection, then pull down to try again.') : empty('Loading…')}</section>` };
  else {
    const inR = (a, b) => t => t._d >= a && t._d <= b;
    page = PAGES[rt.name](rt, P, { cur: state.all.filter(inR(P.start, P.end)), prev: state.all.filter(inR(P.prevStart, P.prevEnd)) });
  }
  $('appbar').classList.toggle('drill', !isTab);
  $('appbar').classList.toggle('nocur', ['category', 'merchant', 'card', 'month', 'day'].includes(rt.name));  // Search, Trends… keep the switch
  $('back').hidden = isTab;
  $('title').textContent = page.title || TITLES[rt.name] || '';
  $('title').title = page.title || '';
  $('sub').hidden = !page.sub; $('sub').textContent = page.sub || '';
  document.title = `${$('title').textContent} · Expenses`;
  $('view').innerHTML = page.html;
  if (rt.name === 'search' && $('search')) {
    renderResults();
    const q = rt.q.get('q') || state.search;
    if (changed && q && (q !== state.search || !state.results)) { $('search').value = q; runSearch(); }
  }
  if (changed && lastHash !== null) {
    scrollTo(0, popped ? scrolls[rt.hash] || 0 : 0);
    if (rt.name === 'search') $('search')?.focus(); else if (render.done) $('title').focus({ preventScroll: true });
  }
  render.done = true;
}

/* ---------- Search ---------- */
let searchTimer;
async function runSearch() {
  const box = $('search'), q = (box ? box.value : state.search).trim();
  state.search = q;
  if (!box) { state.results = null; return; }  // not on the search page: search again when it is opened
  history.replaceState(history.state, '', q ? `#/search?q=${enc(q)}` : '#/search'); lastHash = location.hash;
  if (!q) { state.results = null; if ($('results')) renderResults(); return; }
  state.results = null; renderResults();
  try {
    const r = await fetch(`/api/search?q=${enc(q)}&currency=${enc(state.currency)}`);
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(r.status);
    const found = await r.json();
    if (state.search !== q) return;  // you kept typing; a newer search is on its way
    state.results = found;
    if ($('results')) renderResults();
  } catch { toast('Search failed. Try again.'); }
}
document.addEventListener('input', e => { if (e.target.id === 'search') { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 300); } });

function reviewNext() {
  const next = document.querySelector('#todo details.txn');
  if (!next) return;
  next.open = true;
  next.scrollIntoView({ behavior: smooth, block: 'center' });
  next.querySelector('select').focus({ preventScroll: true });
}
function toast(text) {
  $('toast').textContent = text; $('toast').hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { $('toast').hidden = true; }, 3500);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-replace]');
  if (a) { e.preventDefault(); go(a.getAttribute('href'), true); return; }
  const b = e.target.closest('[data-go]');
  if (b) { go(b.dataset.go, true); return; }
  if (e.target.closest('#back')) {
    const rt = parseRoute();
    if (depth > 0) history.back();
    else go(`#/${PARENT[rt.name] || 'overview'}?${period(rt.q, rt).qs}`, true);  // opened from a link: go up instead of leaving
    return;
  }
  const sort = e.target.closest('[data-sort]')?.dataset.sort;
  if (sort) { state.merchSort = sort; render(); return; }
  if (e.target.id === 'toggle-ignored') { state.showIgnored = !state.showIgnored; render(); return; }
  const c = e.target.closest('#currency button')?.dataset.c;
  if (c && c !== state.currency) {
    state.currency = c; cache.set('currency', c); state.results = null;
    load().then(() => state.search && runSearch());
  }
});
// Listen on the document so rows in every list work.
document.addEventListener('change', e => {
  if (e.target.name === 'category') e.target.form.querySelector('[name=custom]').parentElement.hidden = e.target.value !== '__new';
});
document.addEventListener('submit', async e => {
  if (!e.target.matches('form.fix')) return;  // leave the sign-out form alone
  e.preventDefault();
  const form = e.target, row = form.closest('details'), f = filterOf(parseRoute());
  const chosen = form.category.value === '__new' ? form.custom.value.trim() : form.category.value;
  if (!chosen) { (form.category.value === '__new' ? form.custom : form.category).focus(); return; }
  const all = form.all ? form.all.checked : false;
  form.querySelector('button').disabled = true;
  const wasReviewing = row.hasAttribute('data-unsure');
  // Saved ones leave the list the moment you tap Save (with "apply to all", every entry the rule covers does);
  // the server's answer then redraws the screen, or puts everything back if saving failed.
  // A re-sorted row stays in the full list, but leaves a category view it no longer belongs to.
  const leavesList = wasReviewing || NOT_COUNTED.has(chosen) || (f.category !== undefined && chosen !== f.category);
  const leaving = !leavesList ? [] : all
    ? [...document.querySelectorAll('details.txn')].filter(d => d.dataset.key === row.dataset.key && d.closest('#todo') === row.closest('#todo'))
    : [row];
  leaving.forEach(d => d.classList.add('leaving'));
  if (wasReviewing) {  // open the next one straight away instead of waiting for the server
    setTimeout(() => { leaving.forEach(d => d.remove()); reviewNext(); }, 250);
  }
  let reply;
  try {
    const r = await fetch(`/api/category?currency=${enc(state.currency)}`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: Number(row.dataset.id), category: chosen, whole_merchant: all }) });
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error(r.status);
    reply = await r.json();
  } catch {
    toast('Could not save. Try again.');
    await load(true);  // brings back anything that was faded out
    return;
  }
  if (wasReviewing) await new Promise(ok => setTimeout(ok, 260));  // let the next one open first, so it stays open below
  const open = document.querySelector('details.txn[open]')?.dataset.id;  // keep the next one open across the redraw
  pending = null;
  cache.set('s|' + reply.summary.currency, JSON.stringify(reply.summary)); cache.set('t|' + reply.summary.currency, JSON.stringify(reply.all));
  setData(reply.summary, reply.all);
  render();
  if (state.search) runSearch();  // refresh the results with the new category
  if (open) document.querySelector(`details.txn[data-id="${open}"]`)?.setAttribute('open', '');
  if (reply.category !== chosen) {  // saved, but something stronger still decides this one: say so instead of pretending
    toast(`Saved, but this one still shows as ${reply.category}. Open it again and untick "apply to all" to change just this one.`);
    return;
  }
  const done = chosen === OWN_TRANSFER ? 'Marked as own transfer' : 'Ignored';
  toast(NOT_COUNTED.has(chosen)
    ? (all ? `${done}, with ${row.dataset.merchant || 'similar messages'} from now on too.` : `${done}. It no longer counts.`)
    : (all ? `Saved. ${row.dataset.merchant || 'Similar messages'} ${row.dataset.merchant ? 'is' : 'are'} now ${chosen}, including future SMS.` : `Saved as ${chosen}.`));
});

history.replaceState({ d: 0 }, '');
load();
</script>
</body>
</html>
